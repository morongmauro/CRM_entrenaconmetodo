<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: en iPhone con notch el contenido llega hasta el
       borde y las barras usan env(safe-area-inset-*). Sin maximum-scale:
       bloquear el zoom rompe la accesibilidad; el zoom automático al enfocar
       inputs ya lo evita movil.css poniéndolos en 16px. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Entrena con Método · CRM</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#F7F4ED" />
  <!-- Logo de marca (la M dentro del anillo). El SVG manda en navegadores
       modernos; el PNG es el respaldo y el ícono de iOS al "Agregar a inicio". -->
  <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/logo-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Entrena con Método" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <!-- Ajustes para el teléfono. DESPUÉS de styles.css: anula reglas suyas,
       y todo va dentro de media queries, así que en escritorio no cambia nada. -->
  <link rel="stylesheet" href="/movil.css" />
  <!-- Capa de marca. SIEMPRE la última: solo redefine color, tipografía,
       radios y sombras para que el CRM se vea como el Meal Tracker y el
       Centro de Recursos. No cambia ninguna clase que use el JS. -->
  <link rel="stylesheet" href="/marca.css" />
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] } } } }
  </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- Login -->
  <div id="login-screen" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-lg max-w-sm w-full p-7">
      <div class="text-center mb-5">
        <img src="/icons/logo.svg" alt="Entrena con Método" class="em-logo em-logo-lg mx-auto" width="56" height="56">
        <h1 class="text-xl font-bold mt-3 text-slate-900">Entrena con Método</h1>
        <p class="text-sm text-slate-500">Centro de control</p>
      </div>
      <form id="login-form" class="space-y-3">
        <div>
          <label for="login-email">Email</label>
          <input id="login-email" type="email" required autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false">
        </div>
        <div>
          <label for="login-pass">Contraseña</label>
          <input id="login-pass" type="password" required autocomplete="current-password">
        </div>
        <button id="login-btn" class="btn btn-primary w-full justify-center" type="submit">Entrar</button>
        <p id="login-error" class="text-red-600 text-xs text-center hidden"></p>
      </form>
      <p class="text-xs text-slate-400 text-center mt-4">
        ¿Primera vez? Crea tu cuenta en Supabase<br>(Authentication → Users → Add user).
      </p>
    </div>
  </div>

  <!-- App -->
  <div id="app-screen" class="hidden">
    <header class="glass">
      <div class="em-topbar">
        <div class="em-brand">
          <img src="/icons/logo.svg" alt="Entrena con Método" class="em-logo" width="40" height="40">
          <div class="em-brand-text">
            <h1>Entrena con Método</h1>
            <p>Centro de control</p>
          </div>
        </div>
        <button id="logout-btn" class="text-xs text-slate-500 hover:text-slate-800">Salir</button>
      </div>
    </header>

    <!-- Cuerpo: menú de secciones + contenido.
         En escritorio el menú es una columna a la izquierda (once secciones no
         caben en una fila sin desbordarse); en el teléfono vuelve a ser una
         tira horizontal que se desliza, pegada bajo la cabecera. -->
    <div class="em-shell">
      <aside class="em-side">
        <nav id="main-nav" class="em-nav" aria-label="Secciones">
          <button data-view="dashboard"   class="nav-item active">Inicio</button>
          <button data-view="seguimiento" class="nav-item">Seguimiento</button>
          <button data-view="pagos"       class="nav-item">Pagos</button>
          <button data-view="pendientes"  class="nav-item">Actividades</button>
          <button data-view="clientes"    class="nav-item">Clientes</button>
          <button data-view="nutricion"   class="nav-item">🥗 Nutrición</button>
          <button data-view="negocio"     class="nav-item">Mi negocio</button>
          <button data-view="ajustes"     class="nav-item">⚙ Ajustes</button>
        </nav>
      </aside>
      <main>
        <div id="view"></div>
      </main>
    </div>

    <footer class="em-footer">
      <div class="em-footer-brand">ENTRENA CON MÉTODO</div>
      <div class="em-footer-tagline">Centro de control del coach</div>
      <div class="em-footer-rights">Datos de clientes · <strong>uso interno</strong>. No compartas esta pantalla.</div>
    </footer>
  </div>

  <!-- Loader inicial -->
  <div id="boot-screen" class="min-h-screen flex flex-col items-center justify-center gap-3">
    <img src="/icons/logo.svg" alt="" class="em-logo em-logo-lg" width="56" height="56">
    <div class="text-slate-400 text-sm">Cargando…</div>
  </div>

  <!-- Modal y toast -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
    <div id="modal-box" class="bg-white rounded-2xl shadow-xl max-w-2xl w-full max-h-[92vh] overflow-hidden flex flex-col">
      <div id="modal-content" class="flex-1 overflow-y-auto"></div>
    </div>
  </div>
  <div id="toast" class="hidden fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-2 rounded-xl shadow-lg z-50 text-sm"></div>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
  <!-- Sección Entrenamiento. DESPUÉS de app.js: usa sus funciones y se
       registra sola en el router y en la barra de navegación. -->
  <script src="/entrenamiento.js"></script>
  <!-- Nutrición del cliente, centralizada. DESPUÉS de app.js: reemplaza
       routes.nutricion y engancha el análisis enriquecido. -->
  <script src="/nutricion-plus.js"></script>
  <!-- Composición del cliente (peso, medidas, metas, actividad y la
       calculadora). Se auto-registra en el router y en la barra. -->
  <script src="/composicion.js"></script>
  <!-- Asistente: responde preguntas leyendo tus propios datos. Va al final
       porque usa la capa db de app.js y los lectores del Mealtracker y del
       Centro de Recursos. -->
  <script src="/asistente.js"></script>
  <!-- Agente de rutinas. DESPUÉS de entrenamiento.js (usa su capa de datos y
       su calendario) y de asistente.js (usa su motor de conversación). -->
  <script src="/asistente-rutinas.js"></script>
</body>
</html>
