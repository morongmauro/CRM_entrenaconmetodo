<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover: en iPhone con notch el contenido llega hasta el
       borde y las barras usan env(safe-area-inset-*). Sin maximum-scale:
       bloquear el zoom rompe la accesibilidad; el zoom automático al enfocar
       inputs ya lo evita movil.css poniéndolos en 16px. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Entrena con Método · CRM</title>
  <link rel="manifest" href="/manifest.json?v=3" />
  <meta name="theme-color" content="#EDECE5" />
  <!-- El mismo ícono de la app nueva (entrenaconmetodoapp). El SVG manda en
       navegadores modernos; el PNG es el respaldo y el ícono de iOS al
       "Agregar a inicio". Nombres nuevos para que iOS no use el viejo guardado. -->
  <link rel="icon" type="image/svg+xml" href="/icons/app.svg?v=4" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/app-192.png?v=4" />
  <link rel="apple-touch-icon" href="/icons/app-apple-touch-icon.png?v=4" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Entrena con Método" />
  <!-- Versión fija: «@2» obligaba a preguntar cada vez cuál era la última. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="/fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css" />
  <!-- Ajustes para el teléfono. DESPUÉS de styles.css: anula reglas suyas,
       y todo va dentro de media queries, así que en escritorio no cambia nada. -->
  <link rel="stylesheet" href="/movil.css" />
  <!-- Capa de marca. SIEMPRE la última: solo redefine color, tipografía,
       radios y sombras para que el CRM se vea como el Meal Tracker y el
       Centro de Recursos. No cambia ninguna clase que use el JS. -->
  <link rel="stylesheet" href="/marca.css" />
  <!-- Marca de la app (visual nueva): la letra, colores, tarjetas y gráficas
       del Meal Tracker para que el CRM se sienta la misma app. La última. -->
  <link rel="stylesheet" href="/marca-app.css" />
  <!-- Diseño: jerarquía, menú en grupos y botones como la app. AL FINAL. -->
  <link rel="stylesheet" href="/diseno.css?v=20261110h" />
  <!-- Tailwind ya compilado (tailwind.config.cjs). Antes lo armaba el CDN en
       el navegador, en cada carga y de nuevo con cada cambio de pantalla: era
       lo que más frenaba el CRM. Va AL FINAL del <head>, que es donde el CDN
       ponía sus estilos, para que todo se vea exactamente igual. -->
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- Login -->
  <div id="login-screen" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-lg max-w-sm w-full p-7">
      <div class="text-center mb-5">
        <img src="/icons/app.svg?v=4" alt="Entrena con Método" class="em-logo em-logo-lg mx-auto" width="56" height="56">
        <h1 class="text-xl font-bold mt-3 text-slate-900">Entrena con Método</h1>
        <p class="text-sm text-slate-500">Centro de control</p>
      </div>
      <form id="login-form" class="space-y-3">
        <div>
          <label for="login-email">Email</label>
          <input id="login-email" type="email" required autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false">
        </div>
        <div>
          <label for="login-pass">Contraseña</label>
          <input id="login-pass" type="password" required autocomplete="current-password">
        </div>
        <button id="login-btn" class="btn btn-primary w-full justify-center" type="submit">Entrar</button>
        <p id="login-error" class="text-red-600 text-xs text-center hidden"></p>
      </form>
      <p class="text-xs text-slate-400 text-center mt-4">
        ¿Primera vez? Crea tu cuenta en Supabase<br>(Authentication → Users → Add user).
      </p>
    </div>
  </div>

  <!-- App -->
  <div id="app-screen" class="hidden">
    <header class="glass">
      <div class="em-topbar">
        <div class="em-brand">
          <img src="/icons/app.svg?v=4" alt="Entrena con Método" class="em-logo" width="40" height="40">
          <div class="em-brand-text">
            <h1>Entrena con Método</h1>
            <p>Centro de control</p>
          </div>
        </div>
        <button id="logout-btn" class="text-xs text-slate-500 hover:text-slate-800">Salir</button>
      </div>
    </header>

    <!-- Cuerpo: menú de secciones + contenido.
         En escritorio el menú es una columna a la izquierda (once secciones no
         caben en una fila sin desbordarse); en el teléfono vuelve a ser una
         tira horizontal que se desliza, pegada bajo la cabecera. -->
    <div class="em-shell">
      <aside class="em-side">
        <nav id="main-nav" class="em-nav" aria-label="Secciones">
          <button data-view="dashboard"   class="nav-item active">Inicio</button>
          <button data-view="seguimiento" class="nav-item">Seguimiento</button>
          <button data-view="dialogos"    class="nav-item">Diálogos</button>
          <button data-view="pagos"       class="nav-item">Pagos</button>
          <button data-view="pendientes"  class="nav-item">Actividades</button>
          <button data-view="clientes"    class="nav-item">Clientes</button>
          <button data-view="listado"     class="nav-item">Listado</button>
          <button data-view="enganche"    class="nav-item">Enganche</button>
          <button data-view="nutricion"   class="nav-item">🥗 Nutrición</button>
          <button data-view="negocio"     class="nav-item">Mi negocio</button>
          <button data-view="ajustes"     class="nav-item">⚙ Ajustes</button>
        </nav>
      </aside>
      <main>
        <div id="view"></div>
      </main>
    </div>

    <footer class="em-footer">
      <div class="em-footer-brand">ENTRENA CON MÉTODO</div>
      <div class="em-footer-tagline">Centro de control del coach</div>
      <div class="em-footer-rights">Datos de clientes · <strong>uso interno</strong>. No compartas esta pantalla.</div>
    </footer>
  </div>

  <!-- Loader inicial -->
  <div id="boot-screen" class="min-h-screen flex flex-col items-center justify-center gap-3">
    <img src="/icons/app.svg?v=4" alt="" class="em-logo em-logo-lg" width="56" height="56">
    <div class="text-slate-400 text-sm">Cargando…</div>
  </div>

  <!-- Modal y toast -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 z-40 flex items-center justify-center p-4">
    <div id="modal-box" class="bg-white rounded-2xl shadow-xl max-w-2xl w-full max-h-[92vh] overflow-hidden flex flex-col">
      <div id="modal-content" class="flex-1 overflow-y-auto"></div>
    </div>
  </div>
  <div id="toast" class="hidden fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-2 rounded-xl shadow-lg z-50 text-sm"></div>

  <script src="/config.js?v=20261104"></script>
  <script src="/app.js?v=20261111a"></script>
  <!-- Figura muscular: dibuja qué trabaja cada ejercicio. ANTES de
       entrenamiento.js, que la usa en la ficha y en el editor. No depende
       de nada: solo expone window.figuraMusculos. -->
  <script src="/musculos-figura.js?v=20261104"></script>
  <!-- Sección Entrenamiento. DESPUÉS de app.js: usa sus funciones y se
       registra sola en el router y en la barra de navegación. -->
  <script src="/entrenamiento.js?v=20261110j"></script>
  <!-- Galería: nombres en inglés y repetidos (usa entrenamiento.js; el
       diccionario nombres-ingles.js se carga solo al abrir la galería). -->
  <script src="/galeria-revision.js?v=20261108"></script>
  <script src="/functional-bodybuilding.js?v=20261108"></script>
  <script src="/archivados-en-uso.js?v=20261108f"></script>
  <!-- Galería: «Ficha incompleta» y «Completar con IA». DESPUÉS de entrenamiento.js. -->
  <script src="/fichas-ia.js?v=20261108b"></script>
  <script src="/ejercicio-nuevo.js?v=20261110a"></script>
  <!-- Videos de la galería: 3 propuestas por ejercicio y pegar tu link.
       DESPUÉS de entrenamiento.js (usa su estado y sus funciones). -->
  <script src="/entreno-videos.js?v=20261109"></script>
  <script src="/entreno-youtube.js?v=20261104"></script>
  <script src="/videos-rotos.js?v=20261109"></script>
  <script src="/comentarios-coach.js?v=20261104"></script>
  <script src="/no-sirve.js?v=20261110c"></script>
  <!-- Tiempos reales del entreno (por ejercicio, descansos, total). DESPUÉS
       de entrenamiento.js (usa entSegTrabajo y entNombres). -->
  <script src="/entreno-tiempos.js?v=20261104"></script>
  <!-- Alternativas de cada ejercicio del constructor (sin IA) y Sustituir en
       su mismo renglón. DESPUÉS de entrenamiento.js (usa _ent y entDb). -->
  <script src="/entreno-alternativas.js?v=20261110c"></script>
  <!-- Bandeja del coach: todo lo que hicieron los clientes, ordenado. DESPUÉS
       de entrenamiento.js (usa sus lecturas de estancamiento y su lector de
       series). Se registra sola en el router y en la barra. -->
  <script src="/bandeja.js?v=20261112a"></script>
  <script src="/comunidad.js?v=20261104"></script>
  <script src="/comunidad-calendario.js?v=20261104"></script>
  <!-- Nutrición del cliente, centralizada. DESPUÉS de app.js: reemplaza
       routes.nutricion y engancha el análisis enriquecido. -->
  <script src="/nutricion-plus.js?v=20261104"></script>
  <!-- Composición del cliente (peso, medidas, metas, actividad y la
       calculadora). Se auto-registra en el router y en la barra. -->
  <script src="/composicion.js?v=20261105"></script>
  <!-- Centro de aprendizaje: qué contenido del Centro de Recursos ha visto
       cada cliente. DESPUÉS de app.js: usa sus catálogos y su lectura del
       centro, y se registra solo en el router y en la barra. -->
  <script src="/centro-aprendizaje.js?v=20261104"></script>
  <!-- Eventos del calendario: natación, mediciones, citas. DESPUÉS de
       entrenamiento.js (usa su catálogo de días) y ANTES del agente de
       rutinas, que los crea por voz. -->
  <script src="/eventos.js?v=20261104"></script>
  <script src="/cardio-opciones.js?v=20261104"></script>
  <!-- Duplicar un ciclo: tus días + lo que movió el cliente como pregunta.
       DESPUÉS de entrenamiento.js y eventos.js (usa evtSumarDias). -->
  <script src="/entreno-ciclos.js?v=20261110a"></script>
  <!-- La fuerza de UN solo día (mover, poner, quitar) y el lote de fuerza.
       DESPUÉS de entrenamiento.js y eventos.js. -->
  <script src="/entreno-dias.js?v=20261104"></script>
  <script src="/entreno-bloques.js?v=20261110d"></script>
  <!-- Unir y separar rutinas (Push + Pull → Upper, Full Body → Upper / Lower…).
       DESPUÉS de entrenamiento.js. -->
  <script src="/entreno-mezcla.js?v=20261104"></script>
  <!-- Videos de técnica: qué le pediste a cada cliente y cómo le fue.
       DESPUÉS de entrenamiento.js. Sale en Entrenamiento y en Seguimiento. -->
  <script src="/videos-tecnica.js?v=20261108q"></script>
  <!-- Diálogos: mensajes listos para WhatsApp con el nombre del cliente -->
  <script src="/dialogos.js?v=20261106"></script>
  <!-- «Esta semana» arriba de la ficha del cliente: cumplimiento, resumen
       escrito y mensajes con sus números. DESPUÉS de entreno-dias.js,
       eventos.js y dialogos.js. -->
  <script src="/seguimiento-semana.js?v=20261109b"></script>
  <script src="/seguimiento-areas.js?v=20261109b"></script>
  <script src="/oportunidades.js?v=20261109b"></script>
  <!-- Ausencias (viaje, enfermedad…) y bienestar cada 15 días: en Seguimiento,
       la Bandeja y «Hoy». DESPUÉS de seguimiento-areas.js. -->
  <script src="/ausencias-crm.js?v=20261104"></script>
  <!-- Mis tareas por cliente: en su Seguimiento y en la lista (usa la tabla pendientes) -->
  <script src="/puntos-app.js?v=20261104"></script>
  <script src="/tareas-coach.js?v=20261104"></script>
  <!-- Listado: todos los clientes desde varios ángulos (solo lee) -->
  <script src="/listado.js?v=20261108"></script>
  <script src="/enganche.js?v=20261104b"></script>
  <!-- CRM en prueba: «Hoy» y «Cartera» (gestión por excepción). Solo se
       ve si prendes «Probar el CRM nuevo» arriba. DESPUÉS de bandeja.js,
       composicion.js, seguimiento-areas.js y enganche.js. -->
  <script src="/crm-prueba.js?v=20261109e"></script>
  <!-- Toques de la semana (matriz por cliente). DESPUÉS de crm-prueba.js y videos-tecnica.js -->
  <script src="/toques.js?v=20261112f"></script>
  <script src="/pendientes-pedir.js?v=20261112d"></script>
  <!-- Cápsulas que le pides leer a cada cliente (Toques). DESPUÉS de toques.js -->
  <script src="/capsulas-toques.js?v=20261112b"></script>
  <!-- Mensajes enviados (registro de todo lo enviado; retirar de su app). DESPUÉS de toques.js -->
  <script src="/mensajes-enviados.js?v=20261112d"></script>
  <!-- Qué tocar y lo que le has dicho por tema (Seguimiento y Toques). DESPUÉS de seguimiento-semana.js, seguimiento-areas.js y toques.js -->
  <script src="/que-tocar.js?v=20261108q"></script>
  <script src="/anotar.js?v=20261106"></script>
  <!-- Equipo: Cartera, Listado y Enganche en una sola lista con vistas. DESPUÉS de listado.js, enganche.js y crm-prueba.js -->
  <script src="/equipo.js?v=20261105"></script>
  <!-- Encuesta de la app: NPS y respuestas por cliente, en Inicio -->
  <script src="/encuesta.js?v=20261108s"></script>
  <!-- Medición de la página de venta (landing), en «Mi negocio». DESPUÉS de app.js. -->
  <script src="/landing-medicion.js?v=20261111a"></script>
  <!-- Diálogo tipo del check-in, por cliente y semana (Seguimiento → Diálogo) -->
  <script src="/dialogo-tipo.js?v=20261104"></script>
  <!-- Asistencia al armar rutinas + Trainerize al lado de lo tuyo. DESPUÉS
       de entrenamiento.js (usa su capa de datos y sus lecturas). -->
  <script src="/entreno-asistencia.js?v=20261109b"></script>
  <!-- Progreso de fuerza (sobrecarga por ejercicio y por patrón): en
       Seguimiento y en la ficha. DESPUÉS de entrenamiento.js. -->
  <script src="/progreso-fuerza.js?v=20261104"></script>
  <!-- Ciclos: cuándo empieza y termina el de cada cliente, y aviso cuando
       vence. DESPUÉS de entrenamiento.js (pestaña «Ciclos» y aviso en Inicio). -->
  <script src="/ciclos-vencen.js?v=20261104"></script>
  <!-- Asistente: responde preguntas leyendo tus propios datos. Va al final
       porque usa la capa db de app.js y los lectores del Mealtracker y del
       Centro de Recursos. -->
  <script src="/asistente.js?v=20261104c"></script>
  <!-- Agente de rutinas. DESPUÉS de entrenamiento.js (usa su capa de datos y
       su calendario) y de asistente.js (usa su motor de conversación). -->
  <script src="/asistente-rutinas.js?v=20261110f"></script>
  <!-- Mesa de trabajo en 4 columnas. DESPUÉS del agente, la asistencia y las alternativas. -->
  <script src="/entreno-mesa4.js?v=20261110c"></script>
  <!-- Íconos de línea en el menú y en el inicio (en vez de emojis). -->
  <script src="/marca-app.js?v=20261105b"></script>
  <!-- Íconos de línea en todo el CRM (en vez de emojis). -->
  <script src="/iconos-linea.js?v=20261104"></script>
  <!-- Más espacio: ocultar el menú y ajustar el ancho de las columnas. -->
  <script src="/columnas.js?v=20261110g"></script>
  <!-- El mismo CRM en el teléfono: versión móvil o escritorio (al final). -->
  <script src="/movil.js?v=20261106b"></script>
</body>
</html>
