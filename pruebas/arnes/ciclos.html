const $ = (s, c = document) => c.querySelector(s);

function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function normalizeName(s){return String(s||'').toLowerCase();}

function modalShell(t,b,f=''){return `<h3>${t}</h3><div>${b}</div><div class="pie">${f}</div>`;}
// Lecturas de movimientos, sesiones y actividades: una cadena falsa que filtra por igualdad.
window.TABLAS = { rutina_movimientos: [], sesiones: [], actividades: [] };
function cadena(t){ const f=[]; const q={ select(){return q;}, eq(c,v){f.push(r=>r[c]===v);return q;}, gte(c,v){f.push(r=>r[c]>=v);return q;}, lte(c,v){f.push(r=>r[c]<=v);return q;}, order(){return q;},
  then(a,b){ return Promise.resolve({data:(TABLAS[t]||[]).filter(r=>f.every(g=>g(r))),error:null}).then(a,b);} }; return q; }
const sb = { from: cadena };
