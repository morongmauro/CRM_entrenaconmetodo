function consulta(tabla){
  const q = { filtros:[], _row:null,
    select(){return q;}, order(){return q;}, range(){return q;},
    eq(c,v){ q.filtros.push([c,v]); return q; },
    in(c,vs){ q.filtros.push([c,(x)=>vs.includes(x)]); return q; },
    update(row){ q._row=row; return q; },
    then(res, rej){
      if (tabla==='ejercicio_video_propuestas' && DB.sinTablaPropuestas) return Promise.resolve({data:null,error:{message:'relation does not exist'}}).then(res,rej);
      if (q._row){
        const filas = DB[tabla].filter(r=>q.filtros.every(([c,v])=>typeof v==='function'?v(r[c]):r[c]===v));
        filas.forEach(r=>Object.assign(r,q._row)); DB.escrituras.push([tabla,q.filtros,q._row]);
        return Promise.resolve({error:null}).then(res,rej);
      }
      const data = DB[tabla].filter(r=>q.filtros.every(([c,v])=>typeof v==='function'?v(r[c]):r[c]===v)).map(r=>({...r}));
      return Promise.resolve({data,error:null}).then(res,rej);
    } };
  return q;
}
