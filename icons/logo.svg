<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Entrena con Método">
  <!-- Logo oficial Entrena con Método: la M dentro del anillo de progreso.
       Mismo trazado que el splash de la app del cliente, sin animación. -->
  <defs>
    <linearGradient id="em-ring" x1="140" y1="60" x2="420" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A4126"/>
      <stop offset="0.55" stop-color="#8A9558"/>
      <stop offset="1" stop-color="#B9D454"/>
    </linearGradient>
    <linearGradient id="em-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A19"/>
      <stop offset="1" stop-color="#0B0B0A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#em-bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#232322" stroke-width="16"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#em-ring)" stroke-width="16"
          stroke-linecap="round" stroke-dasharray="1040 1131" transform="rotate(-90 256 256)"/>
  <circle cx="256" cy="76" r="17" fill="#F5F3EC"/>
  <polyline points="185,313 185,186 270,286 325,194" fill="none" stroke="#F5F3EC"
            stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
